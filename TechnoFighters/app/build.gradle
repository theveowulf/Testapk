plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.techno.fighters'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.techno.fighters'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '2.0'
    }

    signingConfigs {
        release {
            storeFile file('techno.keystore')
            storePassword 'technofighters'
            keyAlias 'techno'
            keyPassword 'technofighters'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
