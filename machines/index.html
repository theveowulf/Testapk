<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les machines-outils du laboratoire de technologie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: atelier de techno, clair et direct, pour élèves de 6e-5e et TNI
   IDEA: le panneau d'atelier — fiches machine affichées au mur, pictogrammes de sécurité
   PICTURE: la photo de la machine + les pièces qu'elle sait faire, en grand
   COLOUR and TYPE: blanc, bleu « obligation » #1559a8, rouge « interdiction » #d7261e, vert sécurité ; Barlow Condensed
   LAYOUT: barre des machines en haut, fiche en deux colonnes, quiz en bas */
:root{color-scheme:light dark;--bg:light-dark(#f4f6f8,#10161d);--card:light-dark(#fff,#18212b);--ink:light-dark(#141a21,#e9eef3);--mute:light-dark(#55606c,#9aa7b4);--line:light-dark(#d9dfe5,#2a3643);--blue:light-dark(#1559a8,#5f9be3);--red:light-dark(#d7261e,#ff6a5f);--green:light-dark(#1d8a4a,#4fcf83);--photo:#fff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header{background:var(--blue);color:#fff}
header .wrap{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 24px}
header h1{font-size:clamp(34px,5vw,52px)}
header p{margin:0;opacity:.9}
nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:22px}
nav button{all:unset;cursor:pointer;background:var(--photo);color:#141a21;border-radius:10px;padding:8px 6px 6px;text-align:center;font:600 15px/1.2 Barlow,sans-serif;border:3px solid transparent;min-height:44px}
nav button img{display:block;height:64px;width:100%;object-fit:contain;margin-bottom:4px}
nav button[aria-current=true]{border-color:var(--red);box-shadow:0 4px 0 rgba(0,0,0,.25)}
nav button:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sheet{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hero .ph{background:var(--photo);display:grid;place-items:center;height:clamp(220px,30vw,330px);padding:16px}
.hero .ph img{max-width:100%;max-height:100%;image-rendering:auto;width:auto;height:100%;object-fit:contain}
.hero .t{padding:16px 18px}
.hero h2{font-size:clamp(34px,4.5vw,48px)}
.hero .t p{margin:6px 0 0;color:var(--mute)}
.can{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.box h3{font-size:24px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.yes h3{color:var(--green)}.no h3{color:var(--red)}
.box ul,.box ol{margin:0;padding-left:1.2em}.box li{margin:4px 0}
.ex{background:var(--photo);border-radius:8px;display:grid;place-items:center;padding:8px;margin-top:10px;min-height:90px}
.ex img{max-height:110px;max-width:100%}
.col{display:grid;gap:14px}
.parts{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0!important}
.parts li{margin:0;background:light-dark(#eaf1fa,#1d2d40);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:500;cursor:pointer;border:2px solid transparent;font-size:16px}
.parts li[aria-pressed=true]{border-color:var(--blue)}
.def{margin-top:10px;min-height:2.6em;color:var(--mute)}
.safe{border:3px solid var(--blue)}
.safe h3{color:var(--blue)}
.picto{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.pi{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;line-height:1.2}
.pi svg{flex:none;width:52px;height:52px}
.quiz{background:var(--card);border-top:6px solid var(--red)}
.quiz h2{font-size:clamp(32px,4vw,44px)}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.score{font:700 22px "Barlow Condensed",sans-serif;color:var(--blue)}
.q{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:center}
.q .qi{background:var(--photo);border-radius:12px;display:grid;place-items:center;min-height:170px;padding:12px}
.q .qi img{max-height:150px;max-width:100%}
.q .qi:empty{display:none}
.qt{font-size:22px;font-weight:600;margin:0 0 12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt,.btn{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;box-sizing:border-box;font-weight:600;background:var(--bg)}
.opt.ok{border-color:var(--green);background:light-dark(#e3f5ea,#163524)}
.opt.ko{border-color:var(--red);background:light-dark(#fde6e4,#3a1a18)}
.fb{margin-top:12px;min-height:1.6em}
.btn{background:var(--blue);color:#fff;border-color:var(--blue);margin-top:12px;text-align:center}
.note{font-size:14px;color:var(--mute);margin-top:18px}
@media(max-width:860px){.sheet,.q{grid-template-columns:minmax(0,1fr)}nav{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:480px){.can,.opts{grid-template-columns:minmax(0,1fr)}nav button img{height:48px}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div><h1>Les machines-outils du laboratoire de technologie</h1><p>Leur rôle, comment s'en servir et les conditions de sécurité</p></div>
    <nav id="nav" aria-label="Machines"></nav>
  </div>
</header>

<main>
  <section class="band"><div class="wrap sheet" id="sheet"></div></section>
  <section class="band quiz" id="quiz-zone">
    <div class="wrap">
      <div class="qhead"><h2>Quiz : quelle machine choisir ?</h2><span class="score" id="score"></span></div>
      <div id="q"></div>
    </div>
  </section>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="mand"><circle cx="26" cy="26" r="25" fill="#1559a8"/></g>
    <g id="forb"><circle cx="26" cy="26" r="22" fill="#fff" stroke="#d7261e" stroke-width="6"/></g>
    <g id="warn"><path d="M26 3 50 47H2Z" fill="#f7c600" stroke="#141a21" stroke-width="3" stroke-linejoin="round"/></g>
  </defs>
</svg>

const Q = [
 {img:'cisaille_ex',t:'Quelle machine a permis d’obtenir ces pièces fines coupées droit ?',a:'cisaille'},
 {img:'perceuse_ex',t:'Quelle machine a fait ces trous ronds ?',a:'perceuse'},
 {img:'thermoplieuse_ex',t:'Quelle machine a plié ces plaques de plastique ?',a:'thermoplieuse'},
 {img:'ponceuse_ex',t:'Quelle machine a arrondi ce coin ?',a:'ponceuse'},
 {img:'miniscie_ex',t:'Ces petites pièces épaisses ont été coupées droit. Avec quelle machine ?',a:'miniscie'},
 {t:'Je dois couper droit une plaque de 10 mm d’épaisseur. Quelle machine ?',a:'scie'},
 {t:'Je veux faire un trou carré. Quelle machine peut le faire ?',a:'none'},
 {t:'Je dois plier une plaque de métal. Quelle machine ?',a:'none'},

 {t:'Je dois couper une plaque de 2 mm d’un bord à l’autre, en ligne droite. Quelle machine ?',a:'cisaille'}
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nav = document.getElementById('nav'), sheet = document.getElementById('sheet');
const picto = k => { const [base, label, glyph] = P[k]; return `<div class="pi"><svg viewBox="0 0 52 52" aria-hidden="true"><use href="#${base}"/>${glyph}</svg><span>${label}</span></div>`; };

nav.innerHTML = M.map(m => `<button id="b-${m.id}" data-id="${m.id}"><img src="${IMG[m.id]}" alt="">${m.name}</button>`).join('');

function show(id){
  const m = M.find(x => x.id === id) || M[0];
  for (const b of nav.children) b.setAttribute('aria-current', b.dataset.id === m.id);
  const ex = IMG[m.id + '_ex'] ? `<div class="ex"><img src="${IMG[m.id + '_ex']}" alt="Exemple de pièces obtenues"></div>` : '';
  sheet.innerHTML = `
   <div>
    <div class="hero"><div class="ph"><img src="${IMG[m.id]}" alt="${esc(m.name)}"></div>
     <div class="t"><h2>${m.name}</h2><p>${m.sub}</p></div></div>
    <div class="can">
     <div class="box yes"><h3>Elle sait faire</h3><ul>${m.yes.map(x => `<li>${x}</li>`).join('')}</ul>${ex}</div>
     <div class="box no"><h3>Elle ne sait pas faire</h3><ul>${m.no.map(x => `<li>${x}</li>`).join('')}</ul></div>
    </div>
   </div>
   <div class="col">
    <div class="box safe"><h3>Sécurité</h3><div class="picto">${m.safe.map(picto).join('')}</div><ul>${m.rules.map(x => `<li>${x}</li>`).join('')}</ul></div>
    <div class="box"><h3>Les éléments de la machine</h3><ul class="parts">${m.parts.map((p, i) => `<li tabindex="0" role="button" aria-pressed="false" data-i="${i}">${p[0]}</li>`).join('')}</ul><p class="def" id="def">Touchez un élément pour voir à quoi il sert.</p></div>
    <div class="box"><h3>Comment l'utiliser</h3><ol>${m.steps.map(x => `<li>${x}</li>`).join('')}</ol></div>
   </div>`;
  const parts = sheet.querySelector('.parts'), def = sheet.querySelector('#def');
  const pick = li => { if (!li) return; for (const x of parts.children) x.setAttribute('aria-pressed', x === li); def.innerHTML = `<strong>${m.parts[li.dataset.i][0]} :</strong> ${m.parts[li.dataset.i][1]}`; };
  parts.addEventListener('click', e => pick(e.target.closest('li')));
  parts.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e.target.closest('li')); } });
}
nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) location.hash = b.dataset.id; });
const route = () => show(location.hash.slice(1));
addEventListener('hashchange', route); route();

/* Quiz */
const qz = document.getElementById('q'), sc = document.getElementById('score');
let order = [], qi = 0, good = 0, done = false;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const OPTS = [...M.map(m => [m.id, m.name]), ['none', 'Aucune de ces machines']];
function start(){ order = shuffle(Q.map((_, i) => i)); qi = 0; good = 0; ask(); }
function ask(){
  done = false;
  sc.textContent = `Question ${qi + 1} / ${order.length} · ${good} bonne${good > 1 ? 's' : ''} réponse${good > 1 ? 's' : ''}`;
  const q = Q[order[qi]];
  qz.innerHTML = `<div class="q"><div class="qi">${q.img ? `<img src="${IMG[q.img]}" alt="Pièces à identifier">` : ''}</div>
   <div><p class="qt">${q.t}</p><div class="opts">${OPTS.map(o => `<button class="opt" data-v="${o[0]}">${o[1]}</button>`).join('')}</div><div class="fb" id="fb"></div></div></div>`;
}
qz.addEventListener('click', e => {
  const n = e.target.closest('.btn');
  if (n) { if (n.id === 'again') { start(); return; } qi++; if (qi < order.length) ask(); else end(); return; }
  const b = e.target.closest('.opt'); if (!b || done) return;
  done = true;
  const q = Q[order[qi]], ok = b.dataset.v === q.a;
  if (ok) good++;
  for (const x of qz.querySelectorAll('.opt')) { if (x.dataset.v === q.a) x.classList.add('ok'); else if (x === b) x.classList.add('ko'); }
  const right = OPTS.find(o => o[0] === q.a)[1];
  const fb = qz.querySelector('#fb');
  fb.innerHTML = (ok ? '<strong style="color:var(--green)">Bravo !</strong>' : `<strong style="color:var(--red)">Non :</strong> la bonne réponse est « ${right} ».`) + (q.a !== 'none' ? ` <a href="#${q.a}">Revoir la fiche</a>` : '') + `<br><button class="btn">${qi + 1 < order.length ? 'Question suivante' : 'Voir mon score'}</button>`;
  sc.textContent = `Question ${qi + 1} / ${order.length} · ${good} bonne${good > 1 ? 's' : ''} réponse${good > 1 ? 's' : ''}`;
});
function end(){
  sc.textContent = '';
  qz.innerHTML = `<p class="qt" style="margin-top:16px">Score : ${good} / ${order.length}</p><p>${good === order.length ? 'Parfait, tu connais les machines de l’atelier !' : good >= order.length / 2 ? 'Bien ! Relis les fiches des machines où tu t’es trompé.' : 'Relis les fiches machine, puis recommence.'}</p><button class="btn" id="again">Recommencer</button>`;
}
start();
}
</script>
